<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grade Hub - Admin Dashboard</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<h1>
Grade Hub Admin
</h1>


<nav>

<a href="admin.html">
Dashboard
</a>

<a href="#" id="logout">
Logout
</a>

</nav>


</header>



<section class="dashboard">


<div class="cards">


<div class="stat-card">

<h3>
Students
</h3>

<p id="studentCount">
0
</p>

</div>



<div class="stat-card">

<h3>
Results Uploaded
</h3>

<p id="resultCount">
0
</p>

</div>




<div class="stat-card">

<h3>
Pending
</h3>

<p id="pendingCount">
0
</p>

</div>


</div>





<div class="card">


<h2>
Student Management
</h2>



<input

type="text"

id="searchStudent"

placeholder="Search student..."

>




<div class="table-container">


<table>


<thead>

<tr>

<th>
Admission
</th>


<th>
Name
</th>


<th>
Class
</th>


<th>
Optional Subjects
</th>


<th>
Actions
</th>


</tr>


</thead>



<tbody id="studentTable">


</tbody>


</table>



</div>


</div>



</section>



<script type="module" src="js/admin.js"></script>

</html>
