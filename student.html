<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Grade Hub - Student Dashboard</title>

<link rel="stylesheet" href="css/style.css">


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    background:
        linear-gradient(
            135deg,
            #eef2ff,
            #f8fafc
        );

    color: #172033;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


/* ==========================================
   HEADER
========================================== */

header {

    min-height: 72px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;

    padding:
        15px
        5%;

    background: #111827;

    color: white;

    box-shadow:
        0 4px 18px
        rgba(15,23,42,.12);
}


header h1 {

    margin: 0;

    font-size: 22px;

    font-weight: 800;
}


nav {

    display: flex;

    align-items: center;

    gap: 8px;
}


nav a {

    color: #cbd5e1;

    text-decoration: none;

    padding:
        9px
        13px;

    border-radius: 9px;

    font-size: 14px;

    font-weight: 700;

    transition: .2s;
}


nav a:hover {

    color: white;

    background: #1f2937;
}


#logout {

    color: #fecaca;

}


#logout:hover {

    background: #7f1d1d;

    color: white;
}


/* ==========================================
   DASHBOARD
========================================== */

.dashboard {

    width: min(
        1150px,
        92%
    );

    margin:
        35px
        auto;

}


/* ==========================================
   CARDS
========================================== */

.card {

    background: white;

    border:
        1px solid
        #e5e9f2;

    border-radius: 18px;

    padding: 24px;

    margin-bottom: 24px;

    box-shadow:
        0 8px 28px
        rgba(15,23,42,.06);
}


.card h2 {

    margin:
        0 0 18px;

    font-size: 20px;
}


/* ==========================================
   PROFILE
========================================== */

.profile-grid {

    display: grid;

    grid-template-columns:
        repeat(
            2,
            minmax(
                0,
                1fr
            )
        );

    gap: 15px;
}


.profile-item {

    padding: 16px;

    background: #f8fafc;

    border:
        1px solid
        #e5e9f2;

    border-radius: 12px;
}


.profile-item span {

    display: block;

    color: #697386;

    font-size: 12px;

    font-weight: 700;

    margin-bottom: 6px;

    text-transform: uppercase;
}


.profile-item strong {

    font-size: 15px;

    color: #172033;

    word-break: break-word;
}


.profile-wide {

    grid-column:
        1 / -1;
}


.dashboard-error {

    padding: 15px;

    border-radius: 10px;

    background: #fef2f2;

    color: #991b1b;

    border:
        1px solid
        #fecaca;
}


/* ==========================================
   STAT CARDS
========================================== */

.cards {

    display: grid;

    grid-template-columns:
        repeat(
            3,
            minmax(
                0,
                1fr
            )
        );

    gap: 18px;

    margin-bottom: 24px;
}


.stat-card {

    background: white;

    border:
        1px solid
        #e5e9f2;

    border-radius: 18px;

    padding: 22px;

    box-shadow:
        0 8px 28px
        rgba(15,23,42,.06);
}


.stat-card h3 {

    margin: 0;

    color: #697386;

    font-size: 14px;

    font-weight: 700;
}


.stat-card p {

    margin:
        10px
        0
        0;

    color: #4f46e5;

    font-size: 30px;

    font-weight: 900;
}


/* ==========================================
   TABLE
========================================== */

.table-container {

    width: 100%;

    overflow-x: auto;
}


table {

    width: 100%;

    border-collapse: collapse;

    min-width: 550px;
}


th,
td {

    padding:
        14px
        16px;

    text-align: left;

    border-bottom:
        1px solid
        #e5e9f2;

    font-size: 14px;
}


th {

    background: #f8fafc;

    color: #475569;

    font-weight: 800;
}


td {

    color: #334155;
}


tbody tr:hover {

    background: #f8fafc;
}


.empty {

    text-align: center;

    color: #697386;

    padding: 30px;
}


/* ==========================================
   CHART
========================================== */

#performanceChart {

    width: 100%;

    max-height: 400px;
}


/* ==========================================
   MOBILE
========================================== */

@media (
    max-width: 750px
) {

    header {

        flex-direction: column;

        align-items: flex-start;

        padding:
            16px
            5%;
    }


    nav {

        width: 100%;
    }


    nav a {

        flex: 1;

        text-align: center;
    }


    .dashboard {

        width: 94%;

        margin:
            20px
            auto;
    }


    .cards {

        grid-template-columns:
            1fr;
    }


    .profile-grid {

        grid-template-columns:
            1fr;
    }


    .profile-wide {

        grid-column:
            auto;
    }


    .card {

        padding: 18px;

        border-radius: 14px;
    }

}


@media (
    max-width: 450px
) {

    header h1 {

        font-size: 19px;
    }


    .stat-card p {

        font-size: 26px;
    }


    .card h2 {

        font-size: 18px;
    }

}

</style>

</head>


<body>


<header>

    <h1>
        Grade Hub Student
    </h1>


    <nav>

        <a href="student.html">
            Results
        </a>

        <a href="#" id="logout">
            Logout
        </a>

    </nav>

</header>



<section class="dashboard">


    <!-- PROFILE -->

    <div class="card">

        <h2>
            Student Profile
        </h2>

        <div id="studentProfile">

            Loading profile...

        </div>

    </div>



    <!-- SUMMARY -->

    <div class="cards">


        <div class="stat-card">

            <h3>
                Average Marks
            </h3>

            <p id="averageMarks">
                0%
            </p>

        </div>


        <div class="stat-card">

            <h3>
                Overall Grade
            </h3>

            <p id="overallGrade">
                -
            </p>

        </div>


        <div class="stat-card">

            <h3>
                Optional Subjects
            </h3>

            <p id="subjectCount">
                0
            </p>

        </div>


    </div>



    <!-- RESULTS -->

    <div class="card">

        <h2>
            My Results
        </h2>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Subject
                        </th>

                        <th>
                            Marks
                        </th>

                        <th>
                            Grade
                        </th>

                    </tr>

                </thead>


                <tbody id="resultTable">

                    <tr>

                        <td
                            colspan="3"
                            class="empty"
                        >
                            Loading results...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>



    <!-- GRAPH -->

    <div class="card">

        <h2>
            Performance Analysis
        </h2>


        <canvas
            id="performanceChart"
        ></canvas>

    </div>


</section>



<script
    src="https://cdn.jsdelivr.net/npm/chart.js"
></script>


<script
    type="module"
    src="js/student.js"
></script>


</body>

</html>
