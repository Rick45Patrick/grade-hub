<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grade Hub - Upload Results</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<h1>
Upload Student Results
</h1>


<nav>

<a href="admin.html">
Back Dashboard
</a>

<a href="#" id="logout">
Logout
</a>

</nav>


</header>



<section class="dashboard">


<div class="card">


<h2>
Student Information
</h2>


<div id="studentInfo">

Loading student...

</div>



</div>




<br>



<div class="card">


<h2>
Enter Marks
</h2>



<form id="resultForm">


<h3>
Compulsory Subjects
</h3>


<label>
Mathematics
</label>

<input 
type="number"
id="mathematics"
min="0"
max="100"
required>



<label>
English
</label>

<input 
type="number"
id="english"
min="0"
max="100"
required>



<label>
Kiswahili
</label>

<input 
type="number"
id="kiswahili"
min="0"
max="100"
required>



<label>
CSL
</label>

<input 
type="number"
id="csl"
min="0"
max="100"
required>





<h3>
Optional Subjects
</h3>



<label>
Optional Subject 1
</label>

<input
type="text"
id="optionalName1"
readonly>



<input 
type="number"
id="optionalMark1"
min="0"
max="100">





<label>
Optional Subject 2
</label>

<input
type="text"
id="optionalName2"
readonly>



<input 
type="number"
id="optionalMark2"
min="0"
max="100">





<label>
Optional Subject 3
</label>

<input
type="text"
id="optionalName3"
readonly>



<input 
type="number"
id="optionalMark3"
min="0"
max="100">





<label>
Term
</label>

<select id="term">

<option>
Term 1
</option>

<option>
Term 2
</option>

<option>
Term 3
</option>

</select>




<label>
Year
</label>

<input
type="number"
id="year"
value="2026">





<button type="submit">

Save Results

</button>


</form>



<p id="message"></p>



</div>


</section>



<script type="module" src="js/upload.js"></script>


</body>

</html>
