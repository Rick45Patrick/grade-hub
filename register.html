<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register — Grade Hub</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="register-page">

    <div class="register-card">

        <div class="register-header">

            <div class="register-logo">
                GH
            </div>

            <h1>Create Account</h1>

            <p>
                Join the Grade Hub Results Portal
            </p>

        </div>


        <!-- ACCOUNT TYPE -->

        <div class="account-type">

            <button
                type="button"
                class="account-option active"
                id="studentType"
            >
                <span>🎓</span>
                <strong>Student</strong>
                <small>View your results</small>
            </button>


            <button
                type="button"
                class="account-option"
                id="adminType"
            >
                <span>🛡️</span>
                <strong>Administrator</strong>
                <small>Manage school results</small>
            </button>

        </div>


        <form id="registerForm">

            <input
                type="hidden"
                id="accountType"
                value="student"
            >


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="fullName">
                    Full name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Choose a username"
                    required
                >

            </div>


            <!-- STUDENT INFORMATION -->

            <div id="studentFields">

                <div class="form-group">

                    <label for="admission">
                        Admission number
                    </label>

                    <input
                        type="text"
                        id="admission"
                        placeholder="e.g. 20260001"
                    >

                </div>


                <div class="form-group">

                    <label for="className">
                        Class
                    </label>

                    <select id="className">

                        <option value="">
                            Select class
                        </option>

                        <option value="BE1">
                            BE1
                        </option>

                        <option value="BE2">
                            BE2
                        </option>

                        <option value="AE1">
                            AE1
                        </option>

                        <option value="AE2">
                            AE2
                        </option>

                        <option value="ME1">
                            ME1
                        </option>

                        <option value="ME2">
                            ME2
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Optional subjects
                    </label>

                    <p class="field-help">
                        Select exactly 3 optional subjects.
                    </p>


                    <div class="subject-grid">

                        <label class="subject-option">
                            <input
                                type="checkbox"
                                name="optionalSubject"
                                value="Physics"
                            >
                            Physics
                        </label>


                        <label class="subject-option">
                            <input
                                type="checkbox"
                                name="optionalSubject"
                                value="Chemistry"
                            >
                            Chemistry
                        </label>


                        <label class="subject-option">
                            <input
                                type="checkbox"
                                name="optionalSubject"
                                value="Biology"
                            >
                            Biology
                        </label>


                        <label class="subject-option">
                            <input
                                type="checkbox"
                                name="optionalSubject"
                                value="Computer Studies"
                            >
                            Computer Studies
                        </label>


                        <label class="subject-option">
                            <input
                                type="checkbox"
                                name="optionalSubject"
                                value="Business Studies"
                            >
                            Business Studies
                        </label>


                        <label class="subject-option">
                            <input
                                type="checkbox"
                                name="optionalSubject"
                                value="Agriculture"
                            >
                            Agriculture
                        </label>

                    </div>

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 8 characters"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Enter password again"
                    required
                >

            </div>


            <button
                type="submit"
                id="registerButton"
                class="primary-button"
            >
                Create Student Account
            </button>


            <div
                id="registerMessage"
                class="register-message"
            ></div>

        </form>


        <div class="register-footer">

            <span>
                Already have an account?
            </span>

            <a href="index.html">
                Sign in
            </a>

        </div>

    </div>

</div>


<script
    type="module"
    src="js/register.js"
></script>

</body>
</html>
