<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Grade Hub | Register</title>

    <link rel="stylesheet" href="css/style.css">
     <link rel="icon" type="image/png" src="./gradehub.png">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .register-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .register-card {
            width: 100%;
            max-width: 850px;
            background: #ffffff;
            border-radius: 18px;
            padding: 35px;
            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.08);
        }

        .register-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 12px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #4f46e5;
            color: white;
            font-size: 21px;
            font-weight: 800;
        }

        .register-header h1 {
            margin: 0;
            font-size: 28px;
        }

        .register-header p {
            margin-top: 8px;
            color: #6b7280;
        }

        .register-message {
            display: none;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .register-message.show {
            display: block;
        }

        .register-message.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .register-message.success {
            background: #dcfce7;
            color: #166534;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group > label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"],
        .form-group select {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #d8dee9;
            border-radius: 9px;
            background: white;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #4f46e5;
            box-shadow:
                0 0 0 3px
                rgba(79, 70, 229, 0.1);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 18px;
        }

        .account-type-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .account-type {
            border: 1px solid #d8dee9;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            display: flex !important;
            gap: 10px;
            align-items: flex-start;
            transition: 0.2s;
        }

        .account-type:hover {
            border-color: #4f46e5;
            background: #fafaff;
        }

        .account-type:has(input:checked) {
            border-color: #4f46e5;
            background: #eef2ff;
        }

        .account-type input {
            margin-top: 3px;
        }

        .account-type span {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .account-type small {
            color: #6b7280;
            font-weight: normal;
            line-height: 1.4;
        }

        .form-help {
            color: #6b7280;
            font-size: 13px;
            margin: -2px 0 10px;
        }

        .subject-section {
            margin-bottom: 18px;
        }

        .subject-section-title {
            font-size: 13px;
            font-weight: 700;
            color: #374151;
            margin: 0 0 8px;
            padding-bottom: 5px;
            border-bottom: 1px solid #e5e7eb;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 7px;
        }

        .subject-option {
            display: flex !important;
            align-items: center;
            gap: 8px;
            padding: 9px;
            border-radius: 7px;
            font-weight: normal !important;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.15s;
        }

        .subject-option:hover {
            background: #f1f5ff;
            border-color: #dbe4ff;
        }

        .subject-option:has(input:checked) {
            background: #eef2ff;
            border-color: #c7d2fe;
        }

        .subject-option input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .subject-option span {
            font-size: 13px;
        }

        .subjects-container {
            border: 1px solid #d8dee9;
            border-radius: 10px;
            padding: 14px;
            max-height: 500px;
            overflow-y: auto;
        }

        .register-button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 14px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }

        .register-button:hover {
            background: #4338ca;
        }

        .register-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .register-footer {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
            font-size: 14px;
        }

        .register-footer a {
            color: #4f46e5;
            font-weight: 700;
            text-decoration: none;
        }

        .hidden {
            display: none !important;
        }

        .selection-counter {
            display: block;
            margin-top: 8px;
            color: #697386;
            font-size: 13px;
        }

        @media (max-width: 650px) {

            .register-card {
                padding: 24px 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .account-type-container {
                grid-template-columns: 1fr;
            }

            .subjects-grid {
                grid-template-columns: 1fr;
            }

            .register-header h1 {
                font-size: 24px;
            }
        }

    </style>

</head>


<body>

<div class="register-container">

    <div class="register-card">

        <div class="register-header">

            <div class="logo">
                GH
            </div>

            <h1>Create Account</h1>

            <p>
                Join Grade Hub and manage your academic progress.
            </p>

        </div>


        <div
            id="registerMessage"
            class="register-message">
        </div>


        <!-- ACCOUNT TYPE -->

        <div class="form-group">

            <label>
                Account Type
            </label>

            <div class="account-type-container">

                <label class="account-type">

                    <input
                        type="radio"
                        name="accountType"
                        value="student"
                        checked
                    >

                    <span>

                        <strong>
                            Student
                        </strong>

                        <small>
                            Access your results and academic dashboard.
                        </small>

                    </span>

                </label>


                <label class="account-type">

                    <input
                        type="radio"
                        name="accountType"
                        value="admin"
                    >

                    <span>

                        <strong>
                            Administrator
                        </strong>

                        <small>
                            Request administrator access.
                        </small>

                    </span>

                </label>

            </div>

        </div>


        <form id="registerForm">


            <!-- BASIC INFORMATION -->

            <div class="form-grid">


                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Choose a username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        required
                    >

                </div>


                <div
                    class="form-group"
                    id="admissionGroup">

                    <label for="admission">
                        Admission Number
                    </label>

                    <input
                        type="text"
                        id="admission"
                        placeholder="e.g. ADM001"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="8"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="8"
                        required
                    >

                </div>

            </div>


            <!-- STUDENT INFORMATION -->

            <div id="studentFields">


                <div class="form-group">

                    <label for="studentClass">
                        Class
                    </label>

                    <select
                        id="studentClass">

                        <option value="">
                            Select your class
                        </option>

                        <option value="Grade 10">
                            Grade 10
                        </option>

                        <option value="Grade 11">
                            Grade 11
                        </option>

                        <option value="Grade 12">
                            Grade 12
                        </option>

                    </select>

                </div>


                <!-- SUBJECTS -->

                <div class="form-group">

                    <label>
                        Optional Subjects
                    </label>

                    <p class="form-help">
                        Select the optional subjects you study.
                    </p>


                    <div class="subjects-container">


                        <div class="subject-section">

                            <p class="subject-section-title">
                                STEM &amp; Sciences
                            </p>

                            <div class="subjects-grid">

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Physics">
                                    <span>Physics</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Chemistry">
                                    <span>Chemistry</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Biology">
                                    <span>Biology</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Geography">
                                    <span>Geography</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="General Science">
                                    <span>General Science</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Computer Science">
                                    <span>Computer Science</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Computer Studies">
                                    <span>Computer Studies</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Advanced Mathematics">
                                    <span>Advanced Mathematics</span>
                                </label>

                            </div>

                        </div>


                        <div class="subject-section">

                            <p class="subject-section-title">
                                Humanities
                            </p>

                            <div class="subjects-grid">

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="History and Government">
                                    <span>History &amp; Government</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Religious Education">
                                    <span>Religious Education</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="CRE">
                                    <span>CRE</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="IRE">
                                    <span>IRE</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="HRE">
                                    <span>HRE</span>
                                </label>

                            </div>

                        </div>


                        <div class="subject-section">

                            <p class="subject-section-title">
                                Languages
                            </p>

                            <div class="subjects-grid">

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="English">
                                    <span>English</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Kiswahili">
                                    <span>Kiswahili</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="French">
                                    <span>French</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="German">
                                    <span>German</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Arabic">
                                    <span>Arabic</span>
                                </label>

                            </div>

                        </div>


                        <div class="subject-section">

                            <p class="subject-section-title">
                                Technical &amp; Applied
                            </p>

                            <div class="subjects-grid">

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Agriculture">
                                    <span>Agriculture</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Design and Technology">
                                    <span>Design &amp; Technology</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Building and Construction">
                                    <span>Building &amp; Construction</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Electricity">
                                    <span>Electricity</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Metalwork">
                                    <span>Metalwork</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Woodwork">
                                    <span>Woodwork</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Power Mechanics">
                                    <span>Power Mechanics</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Fashion and Design">
                                    <span>Fashion &amp; Design</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Home Science">
                                    <span>Home Science</span>
                                </label>

                            </div>

                        </div>


                        <div class="subject-section">

                            <p class="subject-section-title">
                                Business
                            </p>

                            <div class="subjects-grid">

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Business Studies">
                                    <span>Business Studies</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Accounting">
                                    <span>Accounting</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Entrepreneurship">
                                    <span>Entrepreneurship</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Economics">
                                    <span>Economics</span>
                                </label>

                            </div>

                        </div>


                        <div class="subject-section">

                            <p class="subject-section-title">
                                Creative &amp; Performing Arts
                            </p>

                            <div class="subjects-grid">

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Art and Design">
                                    <span>Art &amp; Design</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Music">
                                    <span>Music</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Drama">
                                    <span>Drama</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Performing Arts">
                                    <span>Performing Arts</span>
                                </label>

                                <label class="subject-option">
                                    <input
                                        type="checkbox"
                                        name="subjects"
                                        value="Sports">
                                    <span>Sports</span>
                                </label>

                            </div>

                        </div>

                    </div>


                    <span
                        id="subjectCounter"
                        class="selection-counter">
                        0 subjects selected
                    </span>

                </div>

            </div>


            <button
                type="submit"
                id="registerButton"
                class="register-button">

                Create Student Account

            </button>

        </form>


        <div class="register-footer">

            Already have an account?

            <a href="index.html">
                Sign In
            </a>

        </div>

    </div>

</div>


<script
    type="module"
    src="js/register.js">
</script>


</body>
</html>
