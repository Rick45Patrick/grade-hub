
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grade Hub - Register</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .register-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .register-card {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .register-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 60px;
            height: 60px;
            margin: 0 auto 12px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #4f46e5;
            color: white;
            font-size: 21px;
            font-weight: 800;
        }

        .register-header h1 {
            margin: 0;
            font-size: 28px;
        }

        .register-header p {
            margin-top: 8px;
            color: #6b7280;
        }

        .register-message {
            display: none;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .register-message.show {
            display: block;
        }

        .register-message.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .register-message.success {
            background: #dcfce7;
            color: #166534;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group > label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"],
        .form-group select {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #d8dee9;
            border-radius: 9px;
            background: white;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 18px;
        }

        .account-type-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .account-type {
            border: 1px solid #d8dee9;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            display: flex !important;
            gap: 10px;
            align-items: flex-start;
            transition: 0.2s;
        }

        .account-type:hover {
            border-color: #4f46e5;
        }

        .account-type input {
            margin-top: 3px;
        }

        .account-type span {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .account-type small {
            color: #6b7280;
            font-weight: normal;
            line-height: 1.4;
        }

        .form-help {
            color: #6b7280;
            font-size: 13px;
            margin: -2px 0 10px;
        }

        /* SUBJECT GROUPS */

        .subject-section {
            margin-bottom: 18px;
        }

        .subject-section-title {
            font-size: 13px;
            font-weight: 700;
            color: #374151;
            margin: 0 0 8px;
            padding-bottom: 5px;
            border-bottom: 1px solid #e5e7eb;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 7px;
        }

        .subject-option {
            display: flex !important;
            align-items: center;
            gap: 8px;
            padding: 9px;
            border-radius: 7px;
            font-weight: normal !important;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.15s;
        }

        .subject-option:hover {
            background: #f1f5ff;
            border-color: #dbe4ff;
        }

        .subject-option input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .subject-option span {
            font-size: 13px;
        }

        .subjects-container {
            border: 1px solid #d8dee9;
            border-radius: 10px;
            padding: 14px;
            max-height: 500px;
            overflow-y: auto;
        }

        .register-button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 14px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }

        .register-button:hover {
            background: #4338ca;
        }

        .register-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .register-footer {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
            font-size: 14px;
        }

        .register-footer a {
            color: #4f46e5;
            font-weight: 700;
            text-decoration: none;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 650px) {

            .register-card {
                padding: 24px 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .account-type-container {
                grid-template-columns: 1fr;
            }

            .subjects-grid {
                grid-template-columns: 1fr;
            }

            .register-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="register-container">

    <div class="register-card">

        <!-- HEADER -->

                GH
            </div>

                        name="accountType"

                        name="accountType"
                        value="admin"

                    </span>

        <!-- FORM -->

                    <label for="fullName">
                        Full Name

                        required

                <!-- USERNAME -->

                        Username

                        type="text"
                        id="username"

                        required

                <!-- EMAIL -->

                    <label for="email">
                        Email Address

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        required

                <!-- PASSWORD -->

                    <label for="password">
                        Password

                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"

                        Grade

                                </label>

                                <label class="subject-option">

                                    <span>Advanced Mathematics</span>
                                </label>

                                <label class="subject-option">
                                    <input type="checkbox" name="subjects" value="Computer Science">
                                    <span>Computer Science</span>
                                </label>

                                <label class="subject-option">
                                    <input type="checkbox" name="subjects" value="Computer Studies">
                                    <span>Computer Studies</span>
                                </label>

                                <label class="subject-option">
                                    <input type="checkbox" name="subjects" value="Engineering Science">
                                    <span>Engineering Science</span>
                                </label>

                                <label class="subject-option">
                                    <input type="checkbox" name="subjects" value="Electronics">
                                    <span>Electronics</span>
                                </label>

                            </div>

                        </div>


                        <!-- HUMANITIES -->

                            <p class="subject-section-title">
                                Humanities

                            <div class="subjects-grid">

                                <label class="subject-option">
                                    <input type="checkbox" name="subjects" value="Geography">

                                </label>

                                <label class="subject-option">
                                    <input type="checkbox" name="subjects" value="History and Government">

                                </label>

                                <label class="subject-option">

                                </label>

                                <label class="subject-option">
                                    <input type="checkbox" name="subjects" value="IRE">
                                    <span>IRE</span>
                                </label>

                                <label class="subject-option">
                                    <input type="checkbox" name="subjects" value="HRE">
                                    <span>HRE</span>
                                </label>

                            </div>

                        </div>


                        <!-- LANGUAGES -->

                        <div class="subject-section">

                            <p class="subject-section-title">
                                Languages
                            </p>

                            <div class="subjects-grid">

                                <label class="subject-option">

                                </label>

                                <label class="subject-option">
                                    <input type="checkbox" name="subjects" value="Kiswahili">
                                    <span>Kiswahili</span>
                                </label>

                                    <span>French</span>
                                </label>

                                </label>

                        <!-- TECHNICAL -->

                            <p class="subject-section-title">
                                Technical &amp; Applied Subjects
                            </p>

                            <div class="subjects-grid">

                                <label class="subject-option">
                                    <input type="checkbox" name="subjects" value="Agriculture">
                                    <span>Agriculture</span>
                                </label>

                                <label class="subject-option">
                                    <input type="checkbox" name="subjects" value="Design and Technology">

                                </label>

                                <label class="subject-option">

                                </label>

                                <label class="subject-option">

                                </label>

                                <label class="subject-option">
                                    <input type="checkbox" name="subjects" value="Fashion and Design">

                                </label>

                                <label class="subject-option">
                                    <input type="checkbox" name="subjects" value="Home Science">

                                </label>

                                <label class="subject-option">
                                    <input type="checkbox" name="subjects" value="Food and Nutrition">

                                </label>

                                </label>

                        <!-- BUSINESS -->

                            <p class="subject-section-title">
                                Business &amp; Entrepreneurship

                            <div class="subjects-grid">

                                <label class="subject-option">
                                    <input type="checkbox" name="subjects" value="Business Studies">

                                </label>

                        <!-- CREATIVE -->

                        <!-- MEDIA -->

                            </p>

                type="submit"
                id="registerButton"

                Create Account

            Already have an account?

            <a href="index.html">
                Sign In
            </a>

</div>


<script type="module">

import { supabase } from "./js/supabase.js";


const form =
    document.getElementById("registerForm");

const button =
    document.getElementById("registerButton");

const message =
    document.getElementById("registerMessage");

const studentFields =
    document.getElementById("studentFields");

const studentClass =
    document.getElementById("studentClass");


/* ================================
   SHOW MESSAGE
================================ */

function showMessage(text, type = "error") {

    message.textContent = text;

    message.className =
        "register-message show " + type;

}


/* ================================
   ACCOUNT TYPE
================================ */

function updateAccountType() {

    const selected =
        document.querySelector(
            'input[name="accountType"]:checked'
        );

    if (!selected) {
        return;
    }

    const isStudent =
        selected.value === "student";


    studentFields.classList.toggle(
        "hidden",
        !isStudent
    );


    studentClass.required =
        isStudent;

}


document
    .querySelectorAll(
        'input[name="accountType"]'
    )
    .forEach(input => {

        input.addEventListener(
            "change",
            updateAccountType
        );

    });


updateAccountType();


/* ================================
   FORM SUBMISSION
================================ */

form.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        button.disabled = true;

        button.textContent =
            "Creating Account...";


        try {

            const accountType =
                document.querySelector(
                    'input[name="accountType"]:checked'
                ).value;


            const fullName =
                document
                    .getElementById("fullName")
                    .value
                    .trim();


            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const selectedClass =
                studentClass.value;


            const selectedSubjects =
                Array.from(
                    document.querySelectorAll(
                        'input[name="subjects"]:checked'
                    )
                ).map(
                    checkbox => checkbox.value
                );


            /* ============================
               VALIDATION
            ============================ */

            if (!fullName) {

                throw new Error(
                    "Please enter your full name."
                );

            }


            if (!username) {

                throw new Error(
                    "Please enter a username."
                );

            }


            if (!email) {

                throw new Error(
                    "Please enter your email."
                );

            }


            if (password.length < 6) {

                throw new Error(
                    "Password must contain at least 6 characters."
                );

            }


            if (
                accountType === "student" &&
                !selectedClass
            ) {

                throw new Error(
                    "Please select your grade."
                );

            }


            /* ============================
               CHECK DUPLICATE PROFILE
            ============================ */

            const duplicate =
                await supabase
                    .from("profiles")
                    .select("id")
                    .or(
                        `username.eq.${username},email.eq.${email}`
                    )
                    .limit(1);


            if (duplicate.error) {

                throw duplicate.error;

            }


            if (
                duplicate.data &&
                duplicate.data.length > 0
            ) {

                throw new Error(
                    "That username or email is already registered."
                );

            }


            /* ============================
               CREATE SUPABASE AUTH USER
            ============================ */

            const {
                data: authData,
                error: authError
            } =
                await supabase.auth.signUp({

                    email: email,

                    password: password

                });


            if (authError) {

                throw authError;

            }


            const user =
                authData.user;


            if (!user) {

                throw new Error(
                    "Account creation failed."
                );

            }


            /* ============================
               CREATE PROFILE
            ============================ */

            const {
                error: profileError
            } =
                await supabase
                    .from("profiles")
                    .insert({

                        id: user.id,

                        full_name:
                            fullName,

                        username:
                            username,

                        email:
                            email

                    });


            if (profileError) {

                throw profileError;

            }


            /* ============================
               ADMIN REQUEST
            ============================ */

            if (
                accountType === "admin"
            ) {

                const {
                    error: requestError
                } =
                    await supabase
                        .from("admin_requests")
                        .insert({

                            user_id:
                                user.id,

                            full_name:
                                fullName,

                            username:
                                username,

                            email:
                                email,

                            status:
                                "pending"

                        });


                if (requestError) {

                    throw requestError;

                }


                showMessage(
                    "Account created successfully. Your administrator request is now waiting for Super Admin approval.",
                    "success"
                );

            }


            /* ============================
               STUDENT
            ============================ */

            else {

                const {
                    error: studentError
                } =
                    await supabase
                        .from("students")
                        .insert({

                            user_id:
                                user.id,

                            admission_number:
                                username,

                            class:
                                selectedClass,

                            optional_subjects:
                                selectedSubjects

                        });


                if (studentError) {

                    throw studentError;

                }


                showMessage(
                    "Student account created successfully.",
                    "success"
                );

            }


            /* ============================
               RESET
            ============================ */

            form.reset();


            document.querySelector(
                'input[name="accountType"][value="student"]'
            ).checked = true;


            updateAccountType();

        }


        catch (error) {

            console.error(
                "Registration error:",
                error
            );


            showMessage(
                error.message ||
                "Registration failed.",
                "error"
            );

        }


        finally {

            button.disabled = false;

            button.textContent =
                "Create Account";

        }

    });

</script>
