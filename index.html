
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade Hub | Login</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc);color:#172033}
    .auth-page{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(460px,100%);background:#fff;border:1px solid #e5e9f2;border-radius:22px;padding:34px;box-shadow:0 18px 50px rgba(15,23,42,.09)}
    .brand{text-align:center;margin-bottom:26px}.brand-logo{width:56px;height:56px;margin:0 auto 12px;border-radius:16px;background:#4f46e5;color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}.brand h1{margin:0;font-size:27px}.brand p{color:#697386;margin:7px 0}
    .field{margin-bottom:16px}.field label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;padding:12px 13px;border:1px solid #d9deea;border-radius:10px;outline:none;font:inherit}.field input:focus,.field select:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.1)}
    .login-btn{width:100%;border:0;border-radius:10px;background:#4f46e5;color:#fff;padding:13px;font-weight:800;font-size:15px;cursor:pointer}.login-btn:disabled{opacity:.65;cursor:not-allowed}
    .message{margin:14px 0;padding:11px 13px;border-radius:10px;display:none;font-size:14px}.message.show{display:block}.message.error{background:#fef2f2;color:#991b1b}.message.success{background:#f0fdf4;color:#166534}
    .auth-links{text-align:center;margin-top:18px;color:#697386;font-size:14px}.auth-links a{color:#4f46e5;font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="brand">
        <div class="brand-logo">GH</div>
        <h1>Grade Hub</h1>
        <p>Sign in to your account</p>
      </div>

      <div id="loginMessage" class="message"></div>

      <form id="loginForm">
        <div class="field">
          <label for="loginIdentity">Username or email</label>
          <input id="loginIdentity" type="text" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" autocomplete="current-password" required>
        </div>

        <button id="loginButton" class="login-btn" type="submit">Sign in</button>
      </form>

      <div class="auth-links">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </section>
  </main>

  <script type="module">
    import { supabase } from "./js/supabase.js";

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("loginMessage");

    function show(text, type = "error") {
      message.textContent = text;
      message.className = "message show " + type;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = "Signing in...";

      const identity = document.getElementById("loginIdentity").value.trim();
      const password = document.getElementById("loginPassword").value;

      let email = identity;

      if (!identity.includes("@")) {
        const { data, error } = await supabase
          .from("profiles")
          .select("email")
          .eq("username", identity)
          .maybeSingle();

        if (error || !data?.email) {
          show("Username was not found.");
          button.disabled = false;
          button.textContent = "Sign in";
          return;
        }

        email = data.email;
      }

      const { data, error } =
        await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        show(error.message);
        button.disabled = false;
        button.textContent = "Sign in";
        return;
      }

      const userId = data.user.id;

      const { data: roles } = await supabase
        .from("user_roles")
        .select("role, approved")
        .eq("user_id", userId);

      const role = (roles || []).find(r => r.approved === true)?.role;

      if (!role) {
        await supabase.auth.signOut();
        show("No approved account role found.");
        button.disabled = false;
        button.textContent = "Sign in";
        return;
      }

      if (role === "super_admin") location.href = "superadmin.html";
      else if (role === "admin") location.href = "admin.html";
      else location.href = "student.html";
    });
  </script>
</body>
</html>
