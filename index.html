<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Grade Hub — Login
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <main class="login-page">


        <section class="login-card">


            <div class="brand">

                <div class="brand-icon">
                    GH
                </div>

                <h1>
                    Grade Hub
                </h1>

                <p>
                    Student Results Portal
                </p>

            </div>


            <form id="loginForm">


                <div class="form-group">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    id="loginButton"
                    type="submit"
                >
                    Sign In
                </button>


                <p
                    id="message"
                    class="message"
                ></p>


            </form>


            <div class="login-links">

                <a href="register.html">
                    Create student account
                </a>

            </div>


        </section>


    </main>


    <script
        type="module"
        src="js/auth.js"
    ></script>


</body>

</html>
