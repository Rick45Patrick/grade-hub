
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grade Hub | Login</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      color: #172033;
    }

    .auth-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .auth-card {
      width: min(460px, 100%);
      background: #fff;
      border: 1px solid #e5e9f2;
      border-radius: 22px;
      padding: 34px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, .09);
    }

    .brand {
      text-align: center;
      margin-bottom: 26px;
    }

    .brand-logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 12px;
      border-radius: 16px;
      background: #4f46e5;
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 20px;
    }

    .brand h1 {
      margin: 0;
      font-size: 27px;
    }

    .brand p {
      color: #697386;
      margin: 7px 0;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #d9deea;
      border-radius: 10px;
      outline: none;
      font: inherit;
    }

    .field input:focus,
    .field select:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, .1);
    }

    .login-btn {
      width: 100%;
      border: 0;
      border-radius: 10px;
      background: #4f46e5;
      color: #fff;
      padding: 13px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #4338ca;
    }

    .login-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .message {
      margin: 14px 0;
      padding: 11px 13px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fef2f2;
      color: #991b1b;
    }

    .message.success {
      background: #f0fdf4;
      color: #166534;
    }

    .auth-links {
      text-align: center;
      margin-top: 18px;
      color: #697386;
      font-size: 14px;
    }

    .auth-links a {
      color: #4f46e5;
      font-weight: 700;
      text-decoration: none;
    }

    .auth-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <!-- BRAND -->
      <div class="brand">

        <div class="brand-logo">
          GH
        </div>

        <h1>
          Grade Hub
        </h1>

        <p>
          Sign in to your account
        </p>

      </div>


      <!-- MESSAGE -->
      <div
        id="loginMessage"
        class="message">
      </div>


      <!-- LOGIN FORM -->
      <form id="loginForm">

        <!-- USERNAME / EMAIL -->
        <div class="field">

          <label for="loginIdentity">
            Username or email
          </label>

          <input
            id="loginIdentity"
            type="text"
            autocomplete="username"
            placeholder="Enter username or email"
            required
          >

        </div>


        <!-- PASSWORD -->
        <div class="field">

          <label for="loginPassword">
            Password
          </label>

          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            placeholder="Enter password"
            required
          >

        </div>


        <!-- LOGIN BUTTON -->
        <button
          id="loginButton"
          class="login-btn"
          type="submit">

          Sign in

        </button>

      </form>


      <!-- REGISTER LINK -->
      <div class="auth-links">

        Don't have an account?

        <a href="register.html">
          Create one
        </a>

      </div>

    </section>

  </main>


  <!-- ==================================================
       LOGIN JAVASCRIPT
  ================================================== -->

  <script type="module">

    import { supabase }
      from "./js/supabase.js";


    /* ==================================================
       ELEMENTS
    ================================================== */

    const form =
      document.getElementById("loginForm");

    const button =
      document.getElementById("loginButton");

    const message =
      document.getElementById("loginMessage");


    /* ==================================================
       SHOW MESSAGE
    ================================================== */

    function show(text, type = "error") {

      message.textContent = text;

      message.className =
        "message show " + type;

    }


    /* ==================================================
       RESET BUTTON
    ================================================== */

    function resetButton() {

      button.disabled = false;

      button.textContent =
        "Sign in";

    }


    /* ==================================================
       LOGIN
    ================================================== */

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        /* ----------------------------------------------
           Disable button
        ---------------------------------------------- */

        button.disabled = true;

        button.textContent =
          "Signing in...";


        /* ----------------------------------------------
           Get values
        ---------------------------------------------- */

        const identity =
          document
            .getElementById("loginIdentity")
            .value
            .trim();


        const password =
          document
            .getElementById("loginPassword")
            .value;


        if (!identity || !password) {

          show(
            "Enter your username/email and password."
          );

          resetButton();

          return;
        }


        try {

          /* ============================================
             STEP 1
             FIND EMAIL
          ============================================ */

          let email =
            identity;


          /*
           * If the user entered a username,
           * find their email in profiles.
           */

          if (!identity.includes("@")) {

            const {
              data: profile,
              error: profileError
            } =
              await supabase
                .from("profiles")
                .select("email")
                .eq(
                  "username",
                  identity
                )
                .maybeSingle();


            if (profileError) {

              console.error(
                "Username lookup error:",
                profileError
              );


              show(
                "Unable to find that username."
              );


              resetButton();

              return;
            }


            if (
              !profile ||
              !profile.email
            ) {

              show(
                "Username was not found."
              );


              resetButton();

              return;
            }


            email =
              profile.email;

          }


          /* ============================================
             STEP 2
             SUPABASE LOGIN
          ============================================ */

          const {
            data: loginData,
            error: loginError
          } =
            await supabase
              .auth
              .signInWithPassword({

                email: email,

                password: password

              });


          if (loginError) {

            console.error(
              "Login error:",
              loginError
            );


            show(
              loginError.message
            );


            resetButton();

            return;
          }


          /* ============================================
             GET USER
          ============================================ */

          const user =
            loginData?.user;


          if (!user) {

            show(
              "Login failed. Please try again."
            );


            resetButton();

            return;
          }


          const userId =
            user.id;


          /* ============================================
             STEP 3
             GET USER ROLE
          ============================================ */

          const {
            data: roles,
            error: roleError
          } =
            await supabase
              .from("user_roles")
              .select("role")
              .eq(
                "user_id",
                userId
              );


          if (roleError) {

            console.error(
              "Role lookup error:",
              roleError
            );


            await supabase
              .auth
              .signOut();


            show(
              "Unable to determine your account type."
            );


            resetButton();

            return;
          }


          /* ============================================
             NO ROLE
          ============================================ */

          if (
            !roles ||
            roles.length === 0
          ) {

            await supabase
              .auth
              .signOut();


            show(
              "No account role found. Please contact the administrator."
            );


            resetButton();

            return;
          }


          /* ============================================
             DETERMINE ROLE
          ============================================ */

          let role = null;


          /*
           * SUPER ADMIN HAS HIGHEST PRIORITY
           */

          if (
            roles.some(
              item =>
                item.role ===
                "super_admin"
            )
          ) {

            role =
              "super_admin";

          }


          /*
           * ADMIN
           */

          else if (
            roles.some(
              item =>
                item.role ===
                "admin"
            )
          ) {

            role =
              "admin";

          }


          /*
           * STUDENT
           */

          else if (
            roles.some(
              item =>
                item.role ===
                "student"
            )
          ) {

            role =
              "student";

          }


          /* ============================================
             UNKNOWN ROLE
          ============================================ */

          if (!role) {

            console.error(
              "Unknown roles:",
              roles
            );


            await supabase
              .auth
              .signOut();


            show(
              "Your account has an unknown role. Please contact the administrator."
            );


            resetButton();

            return;
          }


          /* ============================================
             REDIRECT
          ============================================ */

          if (
            role ===
            "super_admin"
          ) {

            window.location.href =
              "superadmin.html";

            return;
          }


          if (
            role ===
            "admin"
          ) {

            window.location.href =
              "admin.html";

            return;
          }


          if (
            role ===
            "student"
          ) {

            window.location.href =
              "student.html";

            return;
          }

        }


        catch (error) {

          console.error(
            "Unexpected login error:",
            error
          );


          try {

            await supabase
              .auth
              .signOut();

          }

          catch (signOutError) {

            console.error(
              "Sign out error:",
              signOutError
            );

          }


          show(
            "Something went wrong while signing in."
          );


          resetButton();

        }

      }
    );

  </script>

</body>
</html>
